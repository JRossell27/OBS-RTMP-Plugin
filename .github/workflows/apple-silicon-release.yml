# Builds and publishes the Apple Silicon macOS plugin ZIP.
# Keep this as the only OBS plugin workflow file to avoid duplicate workflow-key startup errors.
name: Apple Silicon Plugin Release

permissions:
  contents: write

env:
  # OBS 32.0.4 is the oldest macOS 32.x build we currently target.
  # Building against this SDK keeps the plugin loadable for users still on
  # OBS 32.0.x; OBS rejects plugins built with a newer libobs API.
  OBS_SDK_VERSION: "32.0.4"

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_macos_arm64:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install CMake, Ninja, and SIMDe
        run: |
          set -euo pipefail

          # GitHub macOS runners can include preinstalled formulae and pre-tapped
          # third-party repositories. Avoid `brew untap` here: Homebrew refuses to
          # untap repositories that own installed packages (for example bicep from
          # azure/bicep), and that refusal is surfaced as a workflow error.
          for formula in cmake ninja simde; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              echo "$formula is already installed; skipping brew install."
            else
              brew install "$formula"
            fi
          done

      - name: Download pinned OBS SDK app
        id: obs_app
        run: |
          set -euo pipefail
          DMG_URL="https://github.com/obsproject/obs-studio/releases/download/$OBS_SDK_VERSION/OBS-Studio-$OBS_SDK_VERSION-macOS-Apple.dmg"
          DMG_PATH="$RUNNER_TEMP/OBS-Studio-$OBS_SDK_VERSION-macOS-Apple.dmg"
          MOUNT_POINT="$RUNNER_TEMP/obs-sdk-$OBS_SDK_VERSION"

          curl --fail --location --retry 3 "$DMG_URL" --output "$DMG_PATH"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_POINT" -nobrowse -readonly

          OBS_APP="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name 'OBS.app' -print -quit)"
          if [ -z "$OBS_APP" ]; then
            echo "OBS.app was not found in $DMG_PATH" >&2
            find "$MOUNT_POINT" -maxdepth 3 -print >&2 || true
            exit 1
          fi

          echo "app=$OBS_APP" >> "$GITHUB_OUTPUT"
          echo "mount_point=$MOUNT_POINT" >> "$GITHUB_OUTPUT"

      - name: Locate OBS app and libobs framework
        id: obs
        run: |
          set -euo pipefail
          OBS_APP="${{ steps.obs_app.outputs.app }}"
          if [ ! -d "$OBS_APP" ]; then
            echo "OBS.app was not found at $OBS_APP" >&2
            exit 1
          fi

          OBS_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$OBS_APP/Contents/Info.plist")"
          if [ "$OBS_VERSION" != "$OBS_SDK_VERSION" ]; then
            echo "Expected OBS $OBS_SDK_VERSION but mounted OBS $OBS_VERSION" >&2
            exit 1
          fi

          LIBOBS_FRAMEWORK="$(find "$OBS_APP/Contents/Frameworks" -type d -name 'libobs.framework' -print -quit)"
          if [ -z "$LIBOBS_FRAMEWORK" ]; then
            echo "Could not find libobs.framework inside $OBS_APP" >&2
            find "$OBS_APP/Contents/Frameworks" -maxdepth 4 -name 'libobs*' -print >&2 || true
            exit 1
          fi

          LIBOBS_BINARY="$(find "$LIBOBS_FRAMEWORK" -type f -name libobs -print -quit)"
          if [ -z "$LIBOBS_BINARY" ]; then
            echo "Could not find libobs binary inside $LIBOBS_FRAMEWORK" >&2
            find "$LIBOBS_FRAMEWORK" -maxdepth 4 -print >&2 || true
            exit 1
          fi

          echo "version=$OBS_VERSION" >> "$GITHUB_OUTPUT"
          echo "library=$LIBOBS_BINARY" >> "$GITHUB_OUTPUT"

      - name: Download matching OBS headers
        id: headers
        run: |
          set -euo pipefail
          OBS_VERSION="${{ steps.obs.outputs.version }}"
          HEADER_ROOT="$RUNNER_TEMP/obs-studio-$OBS_VERSION"
          ARCHIVE="$RUNNER_TEMP/obs-studio-$OBS_VERSION.tar.gz"

          curl --fail --location --retry 3 \
            "https://github.com/obsproject/obs-studio/archive/refs/tags/$OBS_VERSION.tar.gz" \
            --output "$ARCHIVE"
          mkdir -p "$HEADER_ROOT"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$HEADER_ROOT"

          if [ ! -f "$HEADER_ROOT/libobs/obs-module.h" ]; then
            echo "Downloaded OBS source does not contain libobs/obs-module.h" >&2
            find "$HEADER_ROOT" -maxdepth 3 -name obs-module.h -print >&2 || true
            exit 1
          fi

          SIMDE_INCLUDE_DIR="$(brew --prefix simde)/include"
          if [ ! -f "$SIMDE_INCLUDE_DIR/simde/x86/sse2.h" ]; then
            echo "Homebrew SIMDe headers were not found at $SIMDE_INCLUDE_DIR" >&2
            find "$(brew --prefix simde)" -maxdepth 4 -path '*/simde/x86/sse2.h' -print >&2 || true
            exit 1
          fi

          # The pinned OBS.app provides the matching libobs binary, but it is not
          # a complete plugin-development SDK. The downloaded source headers can
          # also omit generated build headers such as obsconfig.h, so CMake
          # creates a minimal compatibility header for this external plugin.
          echo "include_dir=$HEADER_ROOT/libobs" >> "$GITHUB_OUTPUT"
          echo "simde_include_dir=$SIMDE_INCLUDE_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Apple Silicon build
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/package-root" \
            -DLIBOBS_INCLUDE_DIR="${{ steps.headers.outputs.include_dir }}" \
            -DLIBOBS_LIBRARY="${{ steps.obs.outputs.library }}" \
            -DSIMDE_INCLUDE_DIR="${{ steps.headers.outputs.simde_include_dir }}" \
            -DOBS_VERSION="${{ steps.obs.outputs.version }}"

      - name: Build plugin
        run: cmake --build build --config Release

      - name: Install plugin into package folder
        run: cmake --install build --config Release

      - name: Ad-hoc sign installed plugin bundle
        run: |
          set -euo pipefail
          PLUGIN_BUNDLE="$(find package-root -type d -name 'obs-rtmp-receiver.plugin' -print -quit)"
          if [ -z "$PLUGIN_BUNDLE" ]; then
            echo "Could not find installed obs-rtmp-receiver.plugin bundle" >&2
            find package-root -maxdepth 5 -print >&2 || true
            exit 1
          fi
          codesign --force --deep --sign - "$PLUGIN_BUNDLE"

      - name: Package downloadable ZIP
        run: python3 scripts/package_plugin.py --package-root package-root --output-dir dist --platform macos-arm64

      - name: Verify downloadable ZIP
        run: |
          set -euo pipefail
          test -f dist/obs-rtmp-receiver-macos-arm64.zip
          unzip -l dist/obs-rtmp-receiver-macos-arm64.zip

      - name: Upload workflow artifact
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: obs-rtmp-receiver-macos-arm64
          path: dist/obs-rtmp-receiver-macos-arm64.zip
          if-no-files-found: error

      - name: Publish ZIP to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apple-silicon-latest"
          TITLE="Latest Apple Silicon OBS RTMP Receiver Plugin"
          NOTES="Download obs-rtmp-receiver-macos-arm64.zip below, unzip it, and follow INSTALL.txt. This build is for Apple Silicon Macs only (M1/M2/M3/M4). It is built against OBS $OBS_SDK_VERSION so OBS 32.0.x users are not blocked by the newer-libobs plugin check."

          # Keep the reusable release tag pointed at the commit that produced the
          # current binary, then publish the release as the repository's latest
          # release so it appears prominently on the GitHub Releases page.
          git tag --force "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A previous failed/manual run may have left this reusable release as
            # a draft or prerelease. GitHub rejects marking those releases as
            # latest, so first publish/promote it as a normal release, then make
            # a second API call to mark it latest.
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --draft=false --prerelease=false
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest
          fi

          gh release upload "$TAG" dist/obs-rtmp-receiver-macos-arm64.zip --clobber

      - name: Unmount pinned OBS SDK app
        if: always()
        run: |
          set -euo pipefail
          MOUNT_POINT="${{ steps.obs_app.outputs.mount_point }}"
          if [ -n "$MOUNT_POINT" ] && mount | grep -F " on $MOUNT_POINT " >/dev/null 2>&1; then
            hdiutil detach "$MOUNT_POINT"
          fi

      - name: Print download links
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/apple-silicon-latest"
          {
            echo "## Plugin download"
            echo
            echo "Release page: $RELEASE_URL"
            echo
            echo "Workflow artifact: $ARTIFACT_URL"
            echo
            echo "Download the release asset named \`obs-rtmp-receiver-macos-arm64.zip\`, unzip it, and follow \`INSTALL.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Release page: $RELEASE_URL"
          echo "Workflow artifact: $ARTIFACT_URL"
