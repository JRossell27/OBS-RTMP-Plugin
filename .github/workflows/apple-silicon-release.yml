# Builds and publishes the Apple Silicon macOS plugin ZIP.
# Keep this as the only OBS plugin workflow file to avoid duplicate workflow-key startup errors.
name: Apple Silicon Plugin Release

permissions:
  contents: write

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_macos_arm64:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install CMake, Ninja, and OBS
        run: |
          set -euo pipefail

          # GitHub macOS runners can include preinstalled formulae and pre-tapped
          # third-party repositories. Avoid `brew untap` here: Homebrew refuses to
          # untap repositories that own installed packages (for example bicep from
          # azure/bicep), and that refusal is surfaced as a workflow error.
          for formula in cmake ninja simde; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              echo "$formula is already installed; skipping brew install."
            else
              brew install "$formula"
            fi
          done

          if [ -d /Applications/OBS.app ] || brew list --cask obs >/dev/null 2>&1; then
            echo "OBS is already installed; skipping brew cask install."
          else
            brew install --cask obs
          fi

      - name: Locate OBS app and libobs framework
        id: obs
        run: |
          set -euo pipefail
          OBS_APP="/Applications/OBS.app"
          if [ ! -d "$OBS_APP" ]; then
            echo "OBS.app was not installed at $OBS_APP" >&2
            find /Applications -maxdepth 2 -iname '*OBS*' -print >&2 || true
            exit 1
          fi

          OBS_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$OBS_APP/Contents/Info.plist")"
          LIBOBS_FRAMEWORK="$(find "$OBS_APP/Contents/Frameworks" -type d -name 'libobs.framework' -print -quit)"
          if [ -z "$LIBOBS_FRAMEWORK" ]; then
            echo "Could not find libobs.framework inside $OBS_APP" >&2
            find "$OBS_APP/Contents/Frameworks" -maxdepth 4 -name 'libobs*' -print >&2 || true
            exit 1
          fi

          LIBOBS_BINARY="$(find "$LIBOBS_FRAMEWORK" -type f -name libobs -print -quit)"
          if [ -z "$LIBOBS_BINARY" ]; then
            echo "Could not find libobs binary inside $LIBOBS_FRAMEWORK" >&2
            find "$LIBOBS_FRAMEWORK" -maxdepth 4 -print >&2 || true
            exit 1
          fi

          LIBOBS_HEADERS="$LIBOBS_FRAMEWORK/Headers"
          if [ ! -f "$LIBOBS_HEADERS/obsconfig.h" ]; then
            echo "Could not find generated OBS config header at $LIBOBS_HEADERS/obsconfig.h" >&2
            find "$LIBOBS_FRAMEWORK" -maxdepth 4 -name obsconfig.h -print >&2 || true
            exit 1
          fi

          echo "version=$OBS_VERSION" >> "$GITHUB_OUTPUT"
          echo "library=$LIBOBS_BINARY" >> "$GITHUB_OUTPUT"
          echo "framework_headers=$LIBOBS_HEADERS" >> "$GITHUB_OUTPUT"

      - name: Download matching OBS headers
        id: headers
        run: |
          set -euo pipefail
          OBS_VERSION="${{ steps.obs.outputs.version }}"
          HEADER_ROOT="$RUNNER_TEMP/obs-studio-$OBS_VERSION"
          ARCHIVE="$RUNNER_TEMP/obs-studio-$OBS_VERSION.tar.gz"

          curl --fail --location --retry 3 \
            "https://github.com/obsproject/obs-studio/archive/refs/tags/$OBS_VERSION.tar.gz" \
            --output "$ARCHIVE"
          mkdir -p "$HEADER_ROOT"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$HEADER_ROOT"

          if [ ! -f "$HEADER_ROOT/libobs/obs-module.h" ]; then
            echo "Downloaded OBS source does not contain libobs/obs-module.h" >&2
            find "$HEADER_ROOT" -maxdepth 3 -name obs-module.h -print >&2 || true
            exit 1
          fi

          SIMDE_INCLUDE_DIR="$(brew --prefix simde)/include"
          if [ ! -f "$SIMDE_INCLUDE_DIR/simde/x86/sse2.h" ]; then
            echo "Homebrew SIMDe headers were not found at $SIMDE_INCLUDE_DIR" >&2
            find "$(brew --prefix simde)" -maxdepth 4 -path '*/simde/x86/sse2.h' -print >&2 || true
            exit 1
          fi

          FRAMEWORK_HEADERS="${{ steps.obs.outputs.framework_headers }}"
          if [ ! -f "$FRAMEWORK_HEADERS/obsconfig.h" ]; then
            echo "OBS framework headers do not contain obsconfig.h at $FRAMEWORK_HEADERS" >&2
            exit 1
          fi

          # libobs/obs-config.h includes the generated obsconfig.h header, which
          # is not present in the OBS source archive. Put the installed framework
          # headers first so the build can use OBS' generated configuration, then
          # keep the downloaded source headers as a fallback for any non-generated
          # headers that are not shipped in the framework bundle.
          echo "include_dir=$FRAMEWORK_HEADERS;$HEADER_ROOT/libobs" >> "$GITHUB_OUTPUT"
          echo "simde_include_dir=$SIMDE_INCLUDE_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Apple Silicon build
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/package-root" \
            -DLIBOBS_INCLUDE_DIR="${{ steps.headers.outputs.include_dir }}" \
            -DLIBOBS_LIBRARY="${{ steps.obs.outputs.library }}" \
            -DSIMDE_INCLUDE_DIR="${{ steps.headers.outputs.simde_include_dir }}"

      - name: Build plugin
        run: cmake --build build --config Release

      - name: Install plugin into package folder
        run: cmake --install build --config Release

      - name: Ad-hoc sign installed plugin bundle
        run: |
          set -euo pipefail
          PLUGIN_BUNDLE="$(find package-root -type d -name 'obs-rtmp-receiver.plugin' -print -quit)"
          if [ -z "$PLUGIN_BUNDLE" ]; then
            echo "Could not find installed obs-rtmp-receiver.plugin bundle" >&2
            find package-root -maxdepth 5 -print >&2 || true
            exit 1
          fi
          codesign --force --deep --sign - "$PLUGIN_BUNDLE"

      - name: Package downloadable ZIP
        run: python3 scripts/package_plugin.py --package-root package-root --output-dir dist --platform macos-arm64

      - name: Verify downloadable ZIP
        run: |
          set -euo pipefail
          test -f dist/obs-rtmp-receiver-macos-arm64.zip
          unzip -l dist/obs-rtmp-receiver-macos-arm64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: obs-rtmp-receiver-macos-arm64
          path: dist/obs-rtmp-receiver-macos-arm64.zip
          if-no-files-found: error

      - name: Publish ZIP to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apple-silicon-latest"
          TITLE="Latest Apple Silicon OBS RTMP Receiver Plugin"
          NOTES="Download obs-rtmp-receiver-macos-arm64.zip below, unzip it, and follow INSTALL.txt. This build is for Apple Silicon Macs only (M1/M2/M3/M4)."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          fi

          gh release upload "$TAG" dist/obs-rtmp-receiver-macos-arm64.zip --clobber
